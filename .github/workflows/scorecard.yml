# OpenSSF Scorecard: measures supply-chain security best practices.
# This workflow is guarded by a visibility check: it runs only when the repository is public.
# id-token: write is required by the Scorecard action to publish results to the Security tab.

#
# The check asks the API rather than reading `github.event.repository.private`.
# This workflow also runs on a schedule, and the event payload is not the same
# shape on every trigger; one API call answers identically on all of them.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Run weekly on Sunday at 04:00 UTC, offset from CodeQL to avoid resource contention
    - cron: '0 4 * * 0'

permissions:
  contents: read

jobs:
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # Retried rather than trusted once: a rate limit or a blip would
          # otherwise decide whether the repository counts as public.
          visibility=""
          for attempt in 1 2 3; do
            visibility=$(gh api "repos/$REPO" --jq .visibility 2>/dev/null) && break
            sleep $(( attempt * 5 ))
          done

          if [ -z "$visibility" ]; then
            # Degrade to "not public" instead of failing the workflow. The scan
            # cannot run without knowing, and a red workflow over a transient API
            # error is noise; the warning keeps it from being silent.
            echo "::warning::Could not determine repository visibility after 3 attempts; treating it as non-public."
            echo "public=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "visibility: $visibility"
          if [ "$visibility" = "public" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            # Covers internal as well as private: neither can publish results.
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped on a $visibility repository."
          fi

  scorecard:
    name: OpenSSF Scorecard
    needs: visibility
    if: ${{ needs.visibility.outputs.public == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # Full history required for branch-protection and commit-signing checks
          fetch-depth: 0

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Publish Scorecard results to the Security tab
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3.36.3
        with:
          sarif_file: results.sarif
