# Day-one CI: lint, typecheck, and format checks on every PR and push to main.
# Each job provisions the locally linked @bymax-one/nest-storage library through
# the shared ./.github/actions/setup composite before running its check.
# Additional jobs (test coverage, e2e, build, mutation, export audit) are added
# incrementally as those phases land; they are not stubbed here.
#
# Dependency updates for GitHub Actions are managed by Renovate (see renovate.json).
# No dependabot.yml is used to avoid duplicate PRs.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Run TypeScript
        run: pnpm typecheck

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Check formatting
        run: pnpm format:check

  # The API unit suite is the first coverage-gated tier. It runs after lint on
  # its own runner (the locally linked library is provisioned by the composite)
  # and enforces the 100/100/100/100 threshold baked into apps/api/jest.config.cjs,
  # so any coverage regression fails the check. The worker pool is capped at
  # maxWorkers '50%' in that config to stay memory-safe on small runners.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: API unit coverage
        run: pnpm test:cov:api

  # The API e2e tier boots a real MinIO through Testcontainers (no compose,
  # no services block) and performs the presigned round-trips with plain fetch.
  # GitHub-hosted runners ship a Docker daemon, so Testcontainers pulls and boots
  # the pinned MinIO image directly; the timeout is generous to cover a cold image
  # pull. The suite runs with --runInBand and one container at a time, so it stays
  # memory-safe on the runner. The locally linked library is provisioned by the
  # shared composite, exactly as the other jobs.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Gate on the unit tier too so a coverage regression fails before the slower
    # container-backed e2e runs and can never report green alongside a red unit job.
    needs: [lint, unit]
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: API e2e (presigned round-trips against Testcontainers MinIO)
        run: pnpm --filter api run test:e2e
