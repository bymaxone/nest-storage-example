# Day-one CI: lint, typecheck, and format checks on every PR and push to main.
# Each job provisions the locally linked @bymax-one/nest-storage library through
# the shared ./.github/actions/setup composite before running its check.
# Additional jobs (test coverage, e2e, build, mutation, export audit) are added
# incrementally as those phases land; they are not stubbed here.
#
# Dependency updates for GitHub Actions are managed by Renovate (see renovate.json).
# No dependabot.yml is used to avoid duplicate PRs.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Run TypeScript
        run: pnpm typecheck

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Check formatting
        run: pnpm format:check

  # The API unit suite is the first coverage-gated tier. It runs after lint on
  # its own runner (the locally linked library is provisioned by the composite)
  # and enforces the 100/100/100/100 threshold baked into apps/api/jest.config.cjs,
  # so any coverage regression fails the check. The worker pool is capped at
  # maxWorkers '50%' in that config to stay memory-safe on small runners.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: API unit coverage
        run: pnpm test:cov:api

  # The web unit tier runs the dashboard's Vitest coverage on its own runner.
  # The suite caps its worker pool at maxWorkers '50%' in vitest.config.ts and
  # runs as a separate job from the API unit tier, so the locally linked library
  # is never duplicated across two test runners at once (memory-safe on small
  # runners). The consumed @bymax-one/nest-storage library is provisioned by the
  # shared composite.
  web-tests:
    name: Web tests
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Web unit coverage
        run: pnpm test:cov:web

  # The web build tier compiles the Next.js production bundle. It proves the
  # dashboard builds against the shared-subpath library import and that no
  # NestJS/AWS-SDK code leaks into the client bundle. NEXT_PUBLIC_API_URL is the
  # only build-time env the bundle needs; it is a non-secret endpoint.
  web-build:
    name: Web build
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Build the web app
        run: pnpm --filter web build

  # The API e2e tier boots a real MinIO through Testcontainers (no compose,
  # no services block) and performs the presigned round-trips with plain fetch.
  # GitHub-hosted runners ship a Docker daemon, so Testcontainers pulls and boots
  # the pinned MinIO image directly; the timeout is generous to cover a cold image
  # pull. The suite runs with --runInBand and one container at a time, so it stays
  # memory-safe on the runner. The locally linked library is provisioned by the
  # shared composite, exactly as the other jobs.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Gate on the unit tier too so a coverage regression fails before the slower
    # container-backed e2e runs and can never report green alongside a red unit job.
    needs: [lint, unit]
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: API e2e (presigned round-trips against Testcontainers MinIO)
        run: pnpm --filter api run test:e2e

  # The Playwright journey smoke boots the whole stack: the compose MinIO (via
  # the repo `infra:up`, run by the suite's globalSetup), the API dev server, and
  # the web dev server, then walks the load-bearing dashboard journeys in one
  # Chromium instance. Chromium is installed with its OS dependencies. A single
  # worker keeps the run memory-safe on the runner (the library is loaded once by
  # the API process, never fanned out).
  playwright:
    name: Playwright journeys
    runs-on: ubuntu-latest
    needs: [lint, web-build]
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Install Chromium with OS dependencies
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run the dashboard journey smoke
        run: pnpm --filter web run test:e2e
