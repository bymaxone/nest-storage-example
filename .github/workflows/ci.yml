# CI — thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The generic pipeline (lint, typecheck, format, unit+coverage, API e2e,
# web-build, export audit, mutation) lives in bymaxone/.github so every repo
# shares one definition. The Playwright web smoke boots this app's MinIO stack,
# so it stays here (its services can't be parameterized in a reusable).
# Mutation runs only on a push to main / manual dispatch, never on PRs or a schedule.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-ci.yml@v1
    with:
      library-repo: bymaxone/nest-storage
      has-web: true
      run-export-audit: true
      run-mutation: true
      run-e2e-web: false # Playwright (MinIO compose stack) kept below
      unit-command: pnpm test:cov:api && pnpm test:cov:web
      e2e-api-command: pnpm --filter api run test:e2e
      mutation-source-globs: '^(apps/api/src/|apps/web/lib/|apps/web/components/)'

  # App-specific web smoke: Playwright's globalSetup boots the compose MinIO plus
  # the API and web dev servers, then walks the dashboard journeys in one Chromium.
  playwright:
    name: Playwright journeys
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
        with:
          library-repo: bymaxone/nest-storage
      - name: Install Chromium with OS dependencies
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run the dashboard journey smoke
        run: pnpm --filter web run test:e2e

  security:
    # Dependency review needs the dependency graph, which is only available on
    # public repos (or private + GitHub Advanced Security). Gated on visibility so
    # it starts running automatically once this repo is made public.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high

  # Single check the org ruleset can require, in every repo, under one name.
  #
  # A required status check is matched by literal name, and this repo's jobs are
  # named nothing like the next repo's — so there is no list of contexts that
  # works org-wide. One aggregate per repo, always spelled `CI passed`, is what
  # makes a single rule at the organisation level possible, and what makes every
  # repository created from now on inherit the gate without being configured.
  #
  # `always()` is what makes this a gate rather than decoration: without it the
  # job is skipped the moment a dependency fails, and a skipped check reports
  # neutral — the pull request would look unblocked precisely when it is broken.
  # `cancelled` is named explicitly for the same reason; a cancelled job is not
  # a passing one, and a queue timeout produces exactly that.
  #
  # A skipped dependency is accepted on purpose: jobs here are conditional on the
  # event, and failing on skip would break every push that legitimately runs a
  # subset.
  ci-pass:
    name: CI passed
    if: always()
    needs: [ci, playwright, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any dependency did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
