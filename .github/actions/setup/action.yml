name: Setup workspace
description: >-
  Set up pnpm + Node, provision the local @bymax-one/nest-storage library
  (checked out beside the repo to satisfy the `file:` dependency and built with
  tsup), then install the workspace with a frozen lockfile.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24

    # pnpm is provided by Node's bundled corepack rather than a third-party action,
    # so the workflow uses only GitHub-owned actions (satisfying the org policy that
    # permits only GitHub-owned and verified actions). The version is taken from each
    # package.json `packageManager` field, so it never drifts from the repo pin.
    - name: Enable pnpm via corepack
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        corepack enable
        pnpm --version

    # The apps consume @bymax-one/nest-storage via `file:../../../nest-storage`, a
    # sibling of the repo checkout, so the lockfile cannot resolve until the library
    # is on disk. Check it out (public repo, tokenless), move it into place beside the
    # workspace, then build it (it ships `dist/` via tsup). Once the library is
    # published to npm and the dependency becomes a registry range, these three steps
    # can be dropped and jobs install straight from the store.
    - name: Check out the @bymax-one/nest-storage library
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        repository: bymaxone/nest-storage
        # Pinned to a specific commit for reproducible builds; bump intentionally
        # to consume upstream library changes (a floating ref would let upstream
        # silently change what CI builds).
        ref: 9fd67705d9973320556a3a1e22b6311dc5d1b4cf
        path: .nest-storage-lib

    - name: Position the library beside the workspace
      shell: bash
      run: |
        rm -rf "${GITHUB_WORKSPACE}/../nest-storage"
        mv "${GITHUB_WORKSPACE}/.nest-storage-lib" "${GITHUB_WORKSPACE}/../nest-storage"

    - name: Build the library
      shell: bash
      working-directory: ${{ github.workspace }}/../nest-storage
      run: |
        pnpm install --frozen-lockfile
        pnpm build

    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
